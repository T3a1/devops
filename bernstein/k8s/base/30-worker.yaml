# Worker : consomme la file Redis "votes" et écrit dans PostgreSQL.
# Pas de Service : personne ne l'appelle (son port 80 ne sert qu'aux sondes de santé).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # l'ancien pod n'est arrêté qu'une fois le nouveau prêt
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: worker
          env:
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: poll-config, key: REDIS_HOST } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: poll-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: poll-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: poll-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: poll-config, key: POSTGRES_USER } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: poll-secrets, key: REDIS_PASSWORD } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: poll-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30     # jusqu'à 60 s pour démarrer la JVM
          readinessProbe:
            httpGet: { path: /readyz, port: http }   # Redis ET PostgreSQL joignables
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # nécessaire pour écouter sur le port 80
