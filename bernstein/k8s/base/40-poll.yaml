# Poll : la page de vote (publique).
# - au moins 2 réplicas (HPA min 2) répartis sur les nœuds ;
# - mise à jour progressive sans coupure (readiness + maxUnavailable 0 + preStop) ;
# - exposée par un Service LoadBalancer (IP publique sur AKS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
    app.kubernetes.io/component: frontend
spec:
  # Pas de "replicas" : c'est le HorizontalPodAutoscaler qui décide (min 2).
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: poll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poll
        app.kubernetes.io/component: frontend
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: poll
      containers:
        - name: poll
          image: poll
          env:
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: poll-config, key: REDIS_HOST } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: poll-secrets, key: REDIS_PASSWORD } }
            - name: GUNICORN_CMD_ARGS   # lu par gunicorn : 2 processus, logs d'accès sur stdout
              value: "--workers 2 --access-logfile - --graceful-timeout 20"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /readyz, port: http }   # Redis joignable
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10    # laisse le temps au Service de retirer le pod avant l'arrêt
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
spec:
  type: LoadBalancer           # IP publique sur AKS ; <pending> sur kind (normal)
  selector:
    app.kubernetes.io/name: poll
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: poll
spec:
  minAvailable: 1              # un "kubectl drain" ne peut jamais retirer le dernier pod poll
  selector:
    matchLabels:
      app.kubernetes.io/name: poll
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poll
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
