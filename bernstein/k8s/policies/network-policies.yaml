# NetworkPolicies : pare-feu entre les pods ("qui a le droit de parler à qui").
# Appliquées par scripts/deploy.sh sur AKS (cluster créé avec Cilium, qui les fait respecter).
# Principe : tout est refusé en entrée, puis on ouvre uniquement les flux nécessaires.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: poll
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# poll et result : accessibles depuis l'extérieur (load balancer), port 80 uniquement
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-frontends
  namespace: poll
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["poll", "result"]
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 80
          protocol: TCP
---
# Redis : seulement depuis poll (écrit les votes) et worker (les lit)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-clients
  namespace: poll
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["poll", "worker"]
      ports:
        - port: 6379
          protocol: TCP
---
# PostgreSQL : seulement depuis worker (écrit) et result (lit)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-clients
  namespace: poll
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["worker", "result"]
      ports:
        - port: 5432
          protocol: TCP
